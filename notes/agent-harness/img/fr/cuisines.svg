<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="Le même modèle, représenté comme un cuisinier, est placé dans deux cuisines avec des outils, instructions et gestion du contexte différents."><rect width="1080" height="600" rx="20" fill="#17191B"/><text x="540" y="55" font-family="'Comic Sans MS','Chalkboard SE','DejaVu Sans',sans-serif" font-size="32" font-weight="700" fill="#ECF0F0" text-anchor="middle">MÊME CUISINIER  =  MÊME MODÈLE</text><text x="540" y="90" font-family="'Comic Sans MS','Chalkboard SE','DejaVu Sans',sans-serif" font-size="18" font-weight="400" fill="#C9D1D1" text-anchor="middle">Les compétences restent. Les conditions de travail changent.</text><path d="M503 158 C477 146 485 108 518 117 C530 101 554 102 569 119 C600 112 613 148 589 158 L589 183 L503 183 Z" stroke="#ECF0F0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M507 174 Q548 180 584 174" stroke="#ECF0F0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M528 185 L528 194 M559 185 L559 194" stroke="#ECF0F0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="546" y="214" font-family="'Comic Sans MS','Chalkboard SE','DejaVu Sans',sans-serif" font-size="17" font-weight="700" fill="#ECF0F0" text-anchor="middle">LLM</text><path d="M511 217 C435 240 365 260 285 278" stroke="#ECF0F0" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M572 217 C655 244 727 257 785 278" stroke="#ECF0F0" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M298 267 L280 280 L300 283" stroke="#ECF0F0" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M770 269 L788 279 L768 285" stroke="#ECF0F0" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M55 297 Q55 278 77 278 L483 278 Q506 278 507 300 L507 527 Q
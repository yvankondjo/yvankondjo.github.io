<style>

/* Mobile first : les styles de base visent un téléphone tenu d'une main (pouce en bas, cibles de 44 px, une colonne, glisser à l'horizontale pour les travaux).
   Les écrans plus grands ajoutent des colonnes à partir de 760 px. Ouverture : espace latent vivant. Puis le réseau et son panneau de cosinus. */
:root{
  --paper:#ffffff; --ink:#111111; --ink-2:#55555a; --ink-3:#9a9aa0; --rule:#ebebeb; --tint:#f4f1f8; --accent:#4f2a8c; --on-accent:#ffffff; --plate:#ffffff;
  --display:"Cormorant Garamond",Garamond,"Times New Roman",serif;
  --text:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --ease:cubic-bezier(.2,.7,.1,1);
  --gut:max(20px,env(safe-area-inset-left,0px));
  --gut-r:max(20px,env(safe-area-inset-right,0px));
  --dock:calc(60px + env(safe-area-inset-bottom,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0c0c0c; --ink:#f2f2f0; --ink-2:#a5a5a0; --ink-3:#6a6a66; --rule:#242424; --tint:#1a1528; --accent:#b9a0f2; --on-accent:#0c0c0c; --plate:#f4f4f2; color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0c0c0c; --ink:#f2f2f0; --ink-2:#a5a5a0; --ink-3:#6a6a66; --rule:#242424; --tint:#1a1528; --accent:#b9a0f2; --on-accent:#0c0c0c; --plate:#f4f4f2; color-scheme:dark}

/* ---------- Base : téléphone ---------- */
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:12px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;padding-bottom:var(--dock)}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent);color:var(--on-accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.in{max-width:1120px;margin:0 auto;padding-left:var(--gut);padding-right:var(--gut-r)}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.lab{color:var(--accent)}
.mut{color:var(--ink-3)}
.ul{border-bottom:1px solid var(--rule);transition:border-color .4s,color .4s}
.ul:hover{border-color:var(--accent);color:var(--accent)}

/* Ouverture */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--rule)}
.hero .in{position:relative;pointer-events:none;padding-block:calc(18px + env(safe-area-inset-top,0px)) 40px;display:flex;flex-direction:column;gap:18px}
.hero a,.hero .creds{pointer-events:auto}
h1{font-family:var(--display);font-weight:500;font-size:clamp(54px,16vw,148px);letter-spacing:-.02em;line-height:.86;margin:0}
h1 span{display:block}
.title{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;margin:0;font-weight:500;font-size:21px;letter-spacing:-.02em;line-height:1.2}
.title::before{content:"";width:24px;height:2px;background:var(--accent);display:block}
.title span{color:var(--ink-3);font-weight:400;font-size:.8em}
.say{font-family:var(--display);font-weight:400;font-size:25px;line-height:1.22;margin:2px 0 0;max-width:20em;text-wrap:balance}
.say i{color:var(--accent)}
.id-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
.creds{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.cred{flex:none;display:flex;align-items:center;justify-content:center;height:34px;width:100px;padding:0 10px;background:var(--plate);border:1px solid var(--rule);transition:border-color .4s}
.cred:active,.cred:hover{border-color:var(--accent)}
.cred img{display:block;height:11px;width:auto}
.ctas{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 14px;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--ink);background:var(--paper);transition:background-color .3s,color .3s,border-color .3s,transform .15s}
.btn:active{transform:scale(.98)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.solid:hover{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.legend{font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;color:var(--ink-3);margin:2px 0 0;max-width:46em}
.hero .in{z-index:1;width:100%}
.space-wrap{position:absolute;inset:0}
.space{position:absolute;inset:0;touch-action:pan-y;overflow:hidden}
#field{position:absolute;inset:0;width:100%;height:100%;display:block}
.space-ui,.space-nn,.space-note{display:none!important}
.space-ui{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}
.space-nn{list-style:none;margin:0;padding:0;border-bottom:1px solid var(--rule)}
.space-nn li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px dashed var(--rule);font-variant-numeric:tabular-nums}
.space-nn li:last-child{border-bottom:0}
.space-nn b{font-family:var(--display);font-weight:500;font-size:20px}
.space-nn li:first-child b{color:var(--accent)}
.space-note{font-size:13px;color:var(--ink-3);margin:10px 0 0;line-height:1.5}
.p-tech{display:flex;flex-wrap:wrap;gap:6px}
.p-tech span{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);border:1px solid var(--rule);padding:4px 8px}
.p-tech span.k{border-color:transparent;color:var(--ink-3);padding-left:0}

/* Sections */
section.s{padding-block:56px;border-bottom:1px solid var(--rule)}
.kick{margin:0 0 10px}
h2{font-family:var(--display);font-weight:500;font-size:34px;line-height:1.06;letter-spacing:-.01em;margin:0 0 10px;text-wrap:balance}
h2 i{color:var(--accent);font-weight:400}
.lead{color:var(--ink-2);margin:0 0 26px;max-width:36em;font-size:15.5px}

/* Réseau + panneau : le panneau d'abord sur téléphone, le réseau en dessous comme carte */
.inst{display:flex;flex-direction:column;gap:18px}
.mnet{order:1;position:relative}
.mlines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:0}
.mlines path{fill:none;stroke:var(--accent);stroke-width:1.3;stroke-dasharray:3 5;animation:run 1.4s linear infinite;opacity:.8}
.mlab{margin:0 0 8px;position:relative;z-index:1}
.mrow{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 34px;position:relative;z-index:1}
.mrow:last-of-type{margin-bottom:12px}
.mchip{all:unset;box-sizing:border-box;cursor:pointer;min-height:38px;padding:0 11px;display:inline-flex;align-items:center;border:1px solid var(--rule);background:var(--paper);font-family:var(--display);font-weight:500;font-size:18px;line-height:1;transition:border-color .3s,color .3s,background-color .3s,opacity .3s}
.mchip.t{font-family:var(--mono);font-weight:400;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;min-height:34px;padding:0 9px}
.mchip.on{border-color:var(--accent);color:var(--accent);background:var(--tint)}
.mchip.me{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.mnet.sel .mchip:not(.on):not(.me){color:var(--ink-3)}
.mchip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mhint{margin:0}
.panel{order:2;border:1px solid var(--rule);padding:18px;display:flex;flex-direction:column;gap:14px}
.panel .p-tech{display:none}
.graph-box{display:none}
.p-h{display:flex;justify-content:space-between;gap:10px}
.p-t{font-family:var(--display);font-weight:500;font-size:30px;line-height:1.05;margin:0}
.p-w{margin:6px 0 0}
.p-q{font-family:var(--display);font-style:italic;font-size:19px;line-height:1.3;color:var(--ink-2);margin:0}
.dims{display:grid;gap:9px;padding-top:12px;border-top:1px dashed var(--rule)}
.dim{display:grid;grid-template-columns:96px minmax(0,1fr) 34px;gap:10px;align-items:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.dim .tr{height:6px;background:var(--rule);position:relative;overflow:hidden}
.dim .tr i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--ink);transition:width .5s var(--ease)}
.dim.top{color:var(--accent)}
.dim.top .tr i{background:var(--accent)}
.dim .v{text-align:right;font-variant-numeric:tabular-nums}
.nn-h{display:flex;justify-content:space-between;padding-top:12px;border-top:1px dashed var(--rule)}
.nn{list-style:none;margin:-4px 0 0;padding:0}
.nn li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:46px;border-bottom:1px dashed var(--rule);cursor:pointer;font-variant-numeric:tabular-nums}
.nn li b{font-family:var(--display);font-weight:500;font-size:20px;transition:color .3s}
.nn li:hover b,.nn li:active b{color:var(--accent)}
.p-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px}
.p-m b{font-family:var(--display);font-weight:500;font-size:32px;line-height:1;color:var(--accent);margin-right:8px}
.p-m span{font-size:13px;color:var(--ink-2)}
.p-l{display:inline-flex;align-items:center;min-height:44px;white-space:nowrap;flex:none}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--gut-r)) 0 calc(-1 * var(--gut));padding:2px var(--gut-r) 6px var(--gut);scroll-snap-type:x mandatory}
.chips::-webkit-scrollbar{display:none}
.chip{all:unset;box-sizing:border-box;flex:none;scroll-snap-align:start;min-height:40px;padding:0 14px;display:inline-flex;align-items:center;border:1px solid var(--rule);font-family:var(--display);font-weight:500;font-size:18px;cursor:pointer;transition:border-color .3s,color .3s,background-color .3s}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--tint)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#graph{display:block;width:100%;height:auto}
#graph text{font-family:var(--text);fill:var(--ink-2);transition:fill .35s}
#graph .big text{font-family:var(--display);font-weight:500;font-size:20px;fill:var(--ink)}
#graph .small text{font-size:12px}
#graph path{fill:none;stroke:var(--rule);stroke-width:1;transition:stroke .35s,opacity .35s}
#graph circle.dot{fill:var(--paper);stroke:var(--ink);stroke-width:1;transition:fill .35s,stroke .35s}
#graph circle.hit{fill:transparent;stroke:none}
#graph g.node{cursor:pointer}
#graph g.node:focus{outline:none}
#graph.on path{opacity:.55}
#graph path.lit{stroke:var(--accent);stroke-width:1.5;opacity:1;stroke-dasharray:3 6;animation:run 1.4s linear infinite}
@keyframes run{to{stroke-dashoffset:-36}}
#graph g.lit circle.dot{fill:var(--accent);stroke:var(--accent)}
#graph g.lit text{fill:var(--accent)}
.graph-cap{display:flex;justify-content:space-between;gap:12px;margin-top:6px}

/* Travaux : on glisse au pouce */
.works{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 calc(-1 * var(--gut-r)) 0 calc(-1 * var(--gut));padding:0 var(--gut-r) 8px var(--gut);scroll-padding-left:var(--gut)}
.works::-webkit-scrollbar{display:none}
.work{flex:0 0 84%;scroll-snap-align:start;display:flex;flex-direction:column;gap:10px;padding:22px;border:1px solid var(--rule);transition:border-color .4s}
.work:hover,.work:active{border-color:var(--accent)}
.work .top{display:flex;justify-content:space-between;gap:10px}
.work h3{font-family:var(--display);font-weight:500;font-size:29px;line-height:1.05;margin:4px 0 0}
.work p{margin:0;color:var(--ink-2);font-size:15px}
.work .k{display:flex;align-items:baseline;gap:10px;margin-top:auto;padding-top:10px}
.work .k b{font-family:var(--display);font-weight:500;font-size:38px;line-height:1;color:var(--accent)}
.work .k span{font-size:13.5px;color:var(--ink-2)}
.swipe{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.dots{display:flex;gap:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--rule);transition:background-color .3s,width .3s}
.dots i.on{background:var(--accent);width:16px;border-radius:3px}
.also{display:flex;flex-direction:column;margin-top:18px;border-top:1px solid var(--rule)}
.also a{display:flex;justify-content:space-between;align-items:center;min-height:48px;border-bottom:1px solid var(--rule);font-family:var(--display);font-weight:500;font-size:20px}
.also a span{font-family:var(--mono);font-size:11px;color:var(--ink-3)}

/* Preuves : une ligne par preuve */
.proofs{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.proof{display:grid;grid-template-columns:112px minmax(0,1fr);gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--rule)}
.proof .plate{height:52px;display:flex;align-items:center;justify-content:center;background:var(--plate);border:1px solid var(--rule);padding:0 10px}
.proof .plate img{max-height:18px;max-width:100%;display:block}
.proof b{display:block;font-family:var(--display);font-weight:500;font-size:20px;line-height:1.15}
.proof span{font-size:13px;color:var(--ink-2)}

/* Écrits, contact */
.post{display:flex;flex-direction:column;gap:2px;padding:14px 0;border-top:1px solid var(--rule)}
.post:last-child{border-bottom:1px solid var(--rule)}
.post b{font-family:var(--display);font-weight:500;font-size:22px;line-height:1.2;transition:color .3s}
.post:hover b{color:var(--accent)}
.end{padding-block:64px 40px}
.mail{display:block;font-family:var(--display);font-weight:500;font-size:clamp(28px,8.4vw,64px);letter-spacing:-.01em;cursor:copy;user-select:all;overflow-wrap:anywhere;padding-bottom:6px;border-bottom:1px solid var(--rule);transition:color .3s,border-color .3s}
.mail:hover{color:var(--accent);border-color:var(--accent)}
.end .row{display:flex;gap:10px 22px;flex-wrap:wrap;margin-top:18px}
.end .row a,.end .row span{min-height:44px;display:inline-flex;align-items:center}
footer .in{display:flex;flex-direction:column;gap:14px;padding-block:22px 28px;border-top:1px solid var(--rule)}

/* Barre du bas, à portée de pouce */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:15;display:grid;grid-template-columns:repeat(4,1fr);background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--rule);padding:0 var(--gut-r) env(safe-area-inset-bottom,0px) var(--gut)}
.dock a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;height:60px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);transition:color .3s}
.dock a::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.4;transition:opacity .3s,transform .3s}
.dock a[aria-current="true"]{color:var(--accent)}
.dock a[aria-current="true"]::before{opacity:1;transform:scale(1.4)}

/* ---------- Tablette et ordinateur ---------- */
@media (min-width:760px){
  body{font-size:16.5px;padding-bottom:0}
  .dock{display:none}
  .hero .in{padding-block:clamp(72px,13vh,128px) clamp(56px,11vh,104px);gap:24px}
  .title{font-size:clamp(22px,2.6vw,30px)}
  .say{font-size:clamp(26px,2.8vw,34px)}
  .creds{gap:8px}
  .cred{height:44px;width:160px;padding:0 14px}
  .cred img{height:16px}
  .space-wrap{position:absolute;inset:0;margin:0;padding:0}
  .space{height:100%;border:0;touch-action:pan-y}
  .space-ui,.space-nn,.space-note{display:none}
  .hero .in{z-index:1}
  .ctas{display:flex;gap:10px}
  .btn{min-height:48px;padding:0 22px}
  section.s{padding-block:clamp(72px,11vh,112px)}
  h2{font-size:clamp(40px,4.8vw,58px);margin-bottom:14px}
  .lead{font-size:16.5px;margin-bottom:40px}
  .chips{display:none}
  .works{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;overflow:visible;margin:0;padding:0}
  .work{padding:26px}
  .work h3{font-size:32px}
  .swipe{display:none}
  .also{flex-direction:row;flex-wrap:wrap;gap:10px 26px;border-top:0}
  .also a{min-height:0;border-bottom:1px solid var(--rule);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
  .also a span{display:none}
  .proofs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;border-top:0}
  .proof{display:flex;flex-direction:column;align-items:stretch;padding:0;border-bottom:0}
  .proof .plate{height:92px;padding:0 20px}
  .proof .plate img{max-height:30px}
  .proof b{font-size:23px}
  .post{flex-direction:row;justify-content:space-between;align-items:baseline}
  .post b{font-size:25px}
  .end{padding-block:clamp(80px,12vh,120px) 48px}
  footer .in{flex-direction:row;justify-content:space-between;align-items:center}
}
@media (min-width:960px){
  .inst{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:40px;align-items:start}
  .panel{order:2;position:sticky;top:24px;padding:22px}
  .panel .p-tech{display:flex}
  .graph-box{order:1;display:block}
  .mnet{display:none}
  .p-t{font-size:32px}
  .dim{grid-template-columns:132px minmax(0,1fr) 34px}
}
/* Violet (indigo), the only site colour */
:root[data-palette="indigo"]{--accent:#4f2a8c;--tint:#f2eef8;--on-accent:#ffffff}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"])[data-palette="indigo"]{--accent:#b9a0f2;--tint:#1a1528;--on-accent:#0c0c0c}
}
:root[data-theme="dark"][data-palette="indigo"]{--accent:#b9a0f2;--tint:#1a1528;--on-accent:#0c0c0c}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

/* Barre du haut, langue, blog */
.bar{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:16px;height:56px;padding-top:env(safe-area-inset-top,0px)}
.mark{font-family:var(--display);font-weight:500;font-size:24px;letter-spacing:-.02em}
.mark::after{content:".";color:var(--accent)}
.bar nav{display:flex;align-items:center;gap:18px}
.bar nav a{display:inline-flex;align-items:center;min-height:44px;color:var(--ink-2);transition:color .3s}
.bar nav a:hover,.bar nav a[aria-current="page"]{color:var(--accent)}
.bar nav .hide-s{display:none}
.lang{display:inline-flex;border:1px solid var(--rule)}
.lang button{all:unset;cursor:pointer;min-width:38px;min-height:34px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--ink-3);transition:color .3s,background-color .3s}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.lang button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hero .in{padding-top:12px}

.view[hidden]{display:none!important}
.blog-head{padding-block:40px 28px}
.blog-head h1{font-family:var(--display);font-weight:500;font-size:clamp(44px,9vw,92px);line-height:.95;letter-spacing:-.015em;margin:0 0 16px}
.blog-head h1 i{color:var(--accent);font-weight:400}
.notes{border-top:1px solid var(--ink);margin-bottom:64px}
.note{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:22px 0;border-bottom:1px solid var(--rule)}
.note .t{font-family:var(--display);font-weight:500;font-size:28px;line-height:1.1;transition:color .3s}
.note:hover .t{color:var(--accent)}
.note p{margin:0;color:var(--ink-2);font-size:15.5px}
.note .meta{display:flex;gap:14px;flex-wrap:wrap}
.art{max-width:720px;padding-block:28px 72px}
.art .back{display:inline-flex;align-items:center;min-height:44px;margin-bottom:18px}
.art h1{font-family:var(--display);font-weight:500;font-size:clamp(38px,7vw,64px);line-height:1;letter-spacing:-.015em;margin:8px 0 18px;text-wrap:balance}
.art .meta{display:flex;gap:14px;flex-wrap:wrap;padding-bottom:22px;margin-bottom:28px;border-bottom:1px solid var(--rule)}
.art p{font-size:17.5px;line-height:1.8;margin:0 0 1.2em}
.art p.lede{font-family:var(--display);font-size:25px;line-height:1.4;color:var(--ink)}
.art p.pull{font-family:var(--display);font-style:italic;font-size:26px;line-height:1.35;color:var(--accent);border-left:2px solid var(--accent);padding-left:18px;margin:1.6em 0}
.art .next{display:flex;flex-direction:column;gap:6px;margin-top:40px;padding-top:22px;border-top:1px solid var(--rule)}
.art .next a{font-family:var(--display);font-weight:500;font-size:26px;line-height:1.15}
.art .next a:hover{color:var(--accent)}
.draft{color:var(--accent)}
.note.soon .t{color:var(--ink-3)}
.note.soon:hover .t{color:var(--ink-3)}
.tags-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tags-row em{font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);padding:3px 7px}
.tags-row em.pj{border-color:transparent;color:var(--accent);padding-left:0}
.filters{display:flex;flex-direction:column;gap:14px;margin-bottom:18px;position:sticky;top:0;z-index:4;background:var(--paper);padding:12px 0;border-bottom:1px solid var(--rule)}
.seg{display:inline-flex;align-self:flex-start;border:1px solid var(--ink)}
.seg button{all:unset;cursor:pointer;min-height:40px;padding:0 16px;display:inline-flex;align-items:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;transition:background-color .3s,color .3s}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.fchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--gut-r)) 0 calc(-1 * var(--gut));padding:0 var(--gut-r) 2px var(--gut)}
.fchips::-webkit-scrollbar{display:none}
.fchip{all:unset;box-sizing:border-box;flex:none;cursor:pointer;min-height:40px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);font-family:var(--display);font-weight:500;font-size:18px;transition:border-color .3s,color .3s,background-color .3s}
.fchip span{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.fchip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--tint)}
.fchip:focus-visible,.seg button:focus-visible,.sortb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sortrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sorts{display:flex;align-items:center;gap:4px}
.sortb{all:unset;cursor:pointer;min-height:36px;padding:0 10px;display:inline-flex;align-items:center;color:var(--ink-3);border-bottom:1px solid transparent;transition:color .3s,border-color .3s}
.sortb[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.series{border:1px solid var(--rule);padding:16px 18px;margin:0 0 28px}
.series ol{list-style:none;margin:10px 0 0;padding:0}
.series li{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:8px 0;border-top:1px dashed var(--rule)}
.series li b,.series li a{font-family:var(--display);font-weight:500;font-size:19px;line-height:1.2}
.series li.here b{color:var(--accent)}
.series li a:hover{color:var(--accent)}
@media (min-width:760px){
  .bar nav .hide-s{display:inline-flex}
  .bar{height:68px}
  .note{grid-template-columns:minmax(0,1fr) 200px;gap:24px;align-items:baseline}
  .note .meta{justify-content:flex-end}
  .note .t{font-size:32px}
  .filters{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between}
  .fchips{flex-wrap:wrap;overflow:visible;margin:0;padding:0;flex:1 1 100%;order:3}
  .sortrow{order:2}
}
</style>
</head>

  S.forEach(x => x.up.forEach(u => full.push({a:u, b:x.id})));
  P.forEach(x => x.up.forEach(u => full.push({a:u, b:x.id})));
  let mchips = {}, mLit = new Set();
  function buildChips(){
    const row = (arr, cls) => arr.map(n => `<button class="mchip ${cls}" type="button" data-id="${n.id}">${cls === "t" ? L(n.t) : L(n.s)}</button>`).join("");
    $("mr-d").innerHTML = row(D, "d"); $("mr-s").innerHTML = row(S, "t"); $("mr-p").innerHTML = row(P, "p");
    mchips = {}; document.querySelectorAll(".mchip").forEach(c => mchips[c.dataset.id] = c);
  }
  function mlines(){
    const box = $("mnet"), Ls = $("mlines");
    if (!box.offsetParent) return;
    const r0 = box.getBoundingClientRect();
    Ls.setAttribute("viewBox", `0 0 ${r0.width} ${r0.height}`);
    const pt = (id, bottom) => { const r = mchips[id].getBoundingClientRect(); return [r.left - r0.left + r.width / 2, (bottom ? r.bottom : r.top) - r0.top]; };
    Ls.innerHTML = [...mLit].map(e => { const [x1, y1] = pt(e.a, true), [x2, y2] = pt(e.b, false), m = (y1 + y2) / 2; return `<path d="M${x1} ${y1} C${x1} ${m} ${x2} ${m} ${x2} ${y2}"/>`; }).join("");
  }
  function mselect(id){
    const {ids, es} = reach(id, full);
    mLit = es; $("mnet").classList.add("sel");
    Object.entries(mchips).forEach(([k, c]) => { c.classList.toggle("on", ids.has(k) && k !== id); c.classList.toggle("me", k === id); });
    mlines();
  }
  new ResizeObserver(mlines).observe($("mnet"));
  if (document.fonts) document.fonts.ready.then(mlines);

  /* ---------------- Panneau ---------------- */
  let dimRows = [];
  function buildDims(){
    $("dims").innerHTML = "";
    dimRows = D.map(d => { const r = document.createElement("div"); r.className = "dim";
      r.innerHTML = `<span>${L(d.s)}</span><span class="tr"><i></i></span><span class="v">0.00</span>`;
      $("dims").appendChild(r); return {r, bar:r.querySelector("i"), v:r.querySelector(".v")}; });
  }
  let current = null, manualUntil = 0;
  function select(id, manual, force){
    if (id === current && !force) return;
    current = id; mselect(id);
    const n = all[id], {ids, es} = reach(id, edges);
    svg.classList.add("on");
    edges.forEach(e => e.el.classList.toggle("lit", es.has(e)));
    Object.values(all).forEach(x => x.el && x.el.classList.toggle("lit", ids.has(x.id)));
    $("mode").textContent = manual ? tx("p_pick") : tx("p_auto");
    const isP = P.includes(n), isD = D.includes(n);
    $("kind").textContent = isP ? tx("k_work") : isD ? tx("k_domain") : tx("k_skill");
    $("p-t").textContent = L(n.t);
    const used = P.filter(p => p.up.includes(id)).map(p => L(p.t));
    $("p-w").textContent = isP ? `${L(n.org)} · ${n.y}` : isD ? tx("k_domain") : tx("used_in")(used.length);
    $("p-q").textContent = isP ? L(n.q) : isD ? L(n.d) : tx("used_list") + used.join(", ") + ".";
    const techs = isP ? n.up.map(x => L(all[x].t)) : isD ? S.filter(x => x.up.includes(id)).map(x => L(x.t)) : [];
    $("p-tech").innerHTML = techs.length ? `<span class="k">${tx("stack")}</span>` + techs.map(x => `<span>${x}</span>`).join("") : "";
    const u = norm(n.v), mx = Math.max(...n.v) || 1, best = n.v.indexOf(mx);
    dimRows.forEach((d, k) => { d.bar.style.width = (n.v[k] / mx * 100).toFixed(1) + "%"; d.v.textContent = (n.v[k] / u).toFixed(2); d.r.classList.toggle("top", k === best); });
    const ranked = P.filter(p => p.id !== id).map(p => ({p, c:cos(n.v, p.v)})).sort((a, b) => b.c - a.c).slice(0, 2);
    $("nn").innerHTML = ranked.map((r, i) => `<li data-id="${r.p.id}"><span class="mono mut">0${i + 1}</span><b>${L(r.p.t)}</b><span class="mono ${i ? "mut" : "lab"}">${r.c.toFixed(3)}</span></li>`).join("");
    $("p-m").innerHTML = isP ? `<b>${lang === "fr" && n.mfr ? n.mfr : n.m[0]}</b><span>${L(n.m[1])}</span>` : "";
    const l = $("p-l");
    if (isP && n.link) { l.href = n.link; l.textContent = n.link.includes("github") ? tx("code") : tx("see"); }
    else { l.href = "#work"; l.textContent = tx("all_work"); }
  }
  const pick = id => { manualUntil = Date.now() + 5000; select(id, true, true); };
  svg.addEventListener("pointerover", e => { const g = e.target.closest("g.node"); if (g && e.pointerType === "mouse") pick(g.dataset.id); });
  svg.addEventListener("click", e => { const g = e.target.closest("g.node"); if (g) pick(g.dataset.id); });
  svg.addEventListener("focusin", e => { const g = e.target.closest("g.node"); if (g) pick(g.dataset.id); });
  $("nn").addEventListener("click", e => { const li = e.target.closest("li"); if (li) pick(li.dataset.id); });
  $("mnet").addEventListener("click", e => { const c = e.target.closest(".mchip"); if (c) pick(c.dataset.id); });
  const order = P.map(p => p.id); let idx = 1;
  if (!reduce) setInterval(() => { if (Date.now() > manualUntil && !$("v-home").hidden) select(order[idx++ % order.length], false); }, 3400);

  /* ---------------- Travaux ---------------- */
  const worksEl = $("works");
  function buildWorks(){
    worksEl.innerHTML = P.slice(0, 4).map(w => { const tag = w.link ? `a href="${w.link}"` : "div", end = w.link ? "a" : "div";
      return `<${tag} class="work"><div class="top mono"><span class="lab">${L(w.org)}</span><span class="mut">${L(w.st)}</span></div><h3>${L(w.t)}</h3><p>${L(w.d)}</p><div class="k"><b>${lang === "fr" && w.mfr ? w.mfr : w.m[0]}</b><span>${L(w.m[1])}</span></div></${end}>`; }).join("");
    $("dots").innerHTML = [...worksEl.children].map(() => "<i></i>").join("");
    syncDots();
  }
  const syncDots = () => { const cards = [...worksEl.children], dots = [...$("dots").children]; if (cards.length < 2) return;
    const i = Math.round(worksEl.scrollLeft / (cards[1].offsetLeft - cards[0].offsetLeft || 1)); dots.forEach((d, k) => d.classList.toggle("on", k === Math.min(i, cards.length - 1))); };
  worksEl.addEventListener("scroll", syncDots, {passive:true});
  let wPause = 0, wVisible = false;
  ["pointerdown","touchstart","wheel","keydown"].forEach(ev => worksEl.addEventListener(ev, () => { wPause = Date.now() + 7000; }, {passive:true}));
  new IntersectionObserver(es => { wVisible = es[0].isIntersecting; }, {threshold:.5}).observe(worksEl);
  if (!reduce) setInterval(() => {
    const cards = worksEl.children;
    if (!wVisible || Date.now() < wPause || worksEl.scrollWidth <= worksEl.clientWidth + 4 || cards.length < 2) return;
    const step = cards[1].offsetLeft - cards[0].offsetLeft;
    worksEl.scrollTo({left:((Math.round(worksEl.scrollLeft / step) + 1) % cards.length) * step, behavior:"smooth"});
  }, 3800);

  /* ---------------- Écrits ---------------- */
  const projName = id => { const p = P.find(x => x.id === id); return p ? L(p.s) : ""; };
  const noteRow = p => {
    const soon = p.status === "soon", tag = soon ? "div" : `a href="#note-${p.slug}"`, end = soon ? "div" : "a";
    const status = soon ? `<span class="mut">${tx("soon")}</span>` : `<span class="draft">${tx("draft")}</span>`;
    const ser = p.series ? `<span class="mut">${L(SERIES[p.series])} ${p.part}/${POSTS.filter(x => x.series === p.series).length}</span>` : "";
    return `<${tag} class="note${soon ? " soon" : ""}"><span><span class="t">${L(p.t)}</span><p>${L(p.sum)}</p>
      <span class="tags-row">${p.themes.map(k => `<em>${L(THEMES[k])}</em>`).join("")}<em class="pj">${projName(p.project)}</em></span></span>
      <span class="meta mono">${status}<span class="mut">${p.min} ${tx("min")}</span>${ser}</span></${end}>`;
  };
  const F = {by:"theme", key:"all", sort:"feat"};
  function filtered(){
    let list = POSTS.filter(p => F.key === "all" || (F.by === "theme" ? p.themes.includes(F.key) : p.project === F.key));
    const rank = p => (p.featured ? 0 : 1) + (p.status === "soon" ? 2 : 0);
    list = list.slice().sort(F.sort === "short" ? (a, b) => a.min - b.min : (a, b) => rank(a) - rank(b));
    return list;
  }
  function buildFilters(){
    const keys = F.by === "theme" ? Object.keys(THEMES).filter(k => POSTS.some(p => p.themes.includes(k)))
                                  : P.map(p => p.id).filter(id => POSTS.some(p => p.project === id));
    const count = k => POSTS.filter(p => F.by === "theme" ? p.themes.includes(k) : p.project === k).length;
    const label = k => F.by === "theme" ? L(THEMES[k]) : projName(k);
    $("fchips").innerHTML = `<button type="button" class="fchip" data-k="all" aria-pressed="${F.key === "all"}">${tx("all")} <span>${POSTS.length}</span></button>` +
      keys.map(k => `<button type="button" class="fchip" data-k="${k}" aria-pressed="${F.key === k}">${label(k)} <span>${count(k)}</span></button>`).join("");
    document.querySelectorAll(".seg button").forEach(b => { b.textContent = tx(b.dataset.by === "theme" ? "by_theme" : "by_project"); b.setAttribute("aria-pressed", String(b.dataset.by === F.by)); });
    document.querySelectorAll(".sortb").forEach(b => { b.textContent = tx(b.dataset.sort === "feat" ? "s_feat" : "s_short"); b.setAttribute("aria-pressed", String(b.dataset.sort === F.sort)); });
    $("sort-l").textContent = tx("sort");
  }
  function buildNotes(){
    $("home-notes").innerHTML = `<div class="notes" style="margin-bottom:0">${POSTS.filter(p => p.featured).map(noteRow).join("")}</div>`;
    $("all-count").textContent = POSTS.length;
    buildFilters();
    const list = filtered();
    $("ncount").textContent = tx("n_notes")(list.length);
    $("blog-notes").innerHTML = list.length ? list.map(noteRow).join("") : `<p class="mut" style="padding:22px 0">${tx("empty")}</p>`;
  }
  document.addEventListener("click", e => {
    const seg = e.target.closest(".seg button"); if (seg) { F.by = seg.dataset.by; F.key = "all"; buildNotes(); return; }
    const fc = e.target.closest(".fchip"); if (fc) { F.key = fc.dataset.k; buildNotes(); return; }
    const sb = e.target.closest(".sortb"); if (sb) { F.sort = sb.dataset.sort; buildNotes(); }
  });
  function renderPost(slug){
    const readable = POSTS.filter(p => p.status !== "soon");
    const i = readable.findIndex(p => p.slug === slug); if (i < 0) return false;
    const p = readable[i], nx = readable[(i + 1) % readable.length];
    const parts = p.series ? POSTS.filter(x => x.series === p.series).sort((a, b) => a.part - b.part) : [];
    const seriesBox = parts.length ? `<div class="series"><span class="mono lab">${tx("series")} · ${L(SERIES[p.series])}</span><ol>${parts.map(x => `<li${x.slug === p.slug ? ' class="here"' : ""}><span class="mono mut">${tx("part")} ${x.part}</span>${x.status === "soon" || x.slug === p.slug ? `<b>${L(x.t)}</b>` : `<a href="#note-${x.slug}">${L(x.t)}</a>`}${x.status === "soon" ? `<span class="mono mut">${tx("soon")}</span>` : ""}</li>`).join("")}</ol></div>` : "";
    $("post").innerHTML = `<a class="back mono ul" href="#blog">${tx("back")}</a>
      <div class="mono lab">${p.themes.map(k => L(THEMES[k])).join(" · ")} · ${projName(p.project)}</div><h1>${L(p.t)}</h1>
      <div class="meta mono"><span class="draft">${tx("draft")}</span><span class="mut">Jacob Kondjo · ${p.min} ${tx("min")}</span></div>
      ${seriesBox}
      ${L(p.body).map((par, k) => par.startsWith("|") ? `<p class="pull">${par.slice(1)}</p>` : `<p${k ? "" : ' class="lede"'}>${par}</p>`).join("")}
      <div class="next"><span class="mono mut">${tx("next")}</span><a href="#note-${nx.slug}">${L(nx.t)} →</a></div>`;
    return true;
  }

  /* ---------------- Vues ---------------- */
  const HOME = ["top","network","work","proof","writing","contact"];
  function route(){
    const h = location.hash.slice(1);
    let view = "home";
    if (h === "blog") view = "blog";
    else if (h.startsWith("note-") && renderPost(h.slice(5))) view = "post";
    $("v-home").hidden = view !== "home"; $("v-blog").hidden = view !== "blog"; $("v-post").hidden = view !== "post";
    $("nav-blog").toggleAttribute("aria-current", view !== "home");
    if (view !== "home") { window.scrollTo(0, 0); dockLinks.forEach(a => a.setAttribute("aria-current", String(a.dataset.s === "blog"))); }
    else if (HOME.includes(h)) { setTimeout(() => { $(h).scrollIntoView(); mlines(); }, 60); }
    else { mlines(); }
  }
  const dockLinks = [...document.querySelectorAll(".dock a")];
  const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting && !$("v-home").hidden) dockLinks.forEach(a => a.setAttribute("aria-current", String(a.dataset.s === (en.target.id === "writing" ? "blog" : en.target.id)))); }), {rootMargin:"-45% 0px -50% 0px"});
  ["network","work","proof","writing","contact"].forEach(id => io.observe($(id)));
  addEventListener("hashchange", route);

  /* ---------------- Langue ---------------- */
  function setLang(l, save){
    lang = l; document.documentElement.lang = l;
    document.querySelectorAll("[data-t]").forEach(el => { const v = T[l][el.dataset.t]; if (typeof v === "string") el.innerHTML = v; });
    document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === l)));
    document.title = "Jacob Kondjo · AI Engineer";
    buildChips(); buildDims(); buildWorks(); buildNotes(); draw(true);
    if (current) select(current, manualUntil > Date.now(), true);
    if (location.hash.startsWith("#note-")) renderPost(location.hash.slice(6));
    if (save) { try { localStorage.setItem("lang", l); } catch (e) {} }
  }
  document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang, true)));
  let saved = null; try { saved = localStorage.getItem("lang"); } catch (e) {}
  const browserFr = (navigator.languages || [navigator.language || ""]).some(x => /^fr\b/i.test(x));
  setLang(saved === "fr" || saved === "en" ? saved : (browserFr ? "fr" : "en"), false);
  new ResizeObserver(() => draw(false)).observe(svg.parentNode);
  select("galileo", false, true);
  route();

  /* ---------------- Espace latent (ouverture) ---------------- */
  const ANCH = [[.12,.3],[.5,.14],[.88,.3],[.86,.78],[.5,.9],[.14,.76]];
  const CONCEPTS = [
    ["PyTorch",[1,0,0,.1,0,.2]],["TensorFlow",[1,0,0,.1,0,.2]],["Transformer",[1,.2,.2,0,0,0]],["Attention",[1,.1,.3,0,0,0]],
    [{en:"Backprop", fr:"Rétropropagation"},[1,0,0,0,0,.1]],["Fine-tuning",[.9,.1,0,0,.3,.3]],["CNN",[1,0,0,0,0,.1]],["YOLOv8",[.9,0,0,.1,.1,.1]],
    ["GPT-2",[1,.2,0,0,0,0]],["Embeddings",[.6,0,.9,0,0,.2]],
    ["Agents",[.1,1,.2,0,.1,0]],["LangGraph",[0,1,.2,.1,0,0]],["MCP",[0,1,0,.3,0,0]],["LiveKit",[0,.9,0,.4,0,0]],
    ["Twilio",[0,.7,0,.5,0,0]],["Function calling",[.1,.9,.1,.1,0,0]],["Claude",[.3,.8,.2,0,0,0]],["Gemini",[.4,.7,.3,0,0,0]],
    ["RAG",[.1,.5,1,0,.2,0]],["pgvector",[0,0,1,.3,0,.3]],["RRF",[0,0,1,0,.2,0]],["Reranking",[.3,0,1,0,.2,0]],
    [{en:"Hybrid search", fr:"Recherche hybride"},[0,0,1,.1,.1,.1]],["BM25",[0,0,1,0,0,.1]],
    ["Langfuse",[0,.4,.1,.2,1,0]],["LLM-as-a-judge",[.2,.4,.2,0,1,0]],["MRR",[0,0,.6,0,1,0]],["Recall@5",[0,0,.6,0,1,0]],["BLEU",[.4,0,0,0,1,0]],
    ["Terraform",[0,0,0,1,0,0]],["Cloud Tasks",[0,.1,0,1,0,0]],["Docker",[0,0,0,1,0,.1]],["Cloud Run",[0,.1,0,1,0,0]],
    ["Azure",[0,0,0,1,0,.1]],["CI/CD",[0,0,0,1,.2,0]],["FastAPI",[0,.3,0,.8,0,0]],
    ["BigQuery",[0,0,.1,.3,0,1]],["Airflow",[0,0,0,.4,0,1]],["dbt",[0,0,0,.2,0,1]],["Vertex AI",[.5,.1,.3,.6,.1,.5]]
  ];
  const frac = x => x - Math.floor(x);
  const hero = $("space"), cv = $("field"), g = cv.getContext("2d");
  let W = 0, H = 0, nodes = [];
  const ptr = {x:0, y:0, on:false, last:0};
  function build(){
    const r = hero.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
    W = r.width; H = r.height; if (!W || !H) return;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    nodes = CONCEPTS.map(([name, v], i) => {
      const s = v.reduce((a, b) => a + b, 0); let x = 0, y = 0;
      v.forEach((w, k) => { x += w * ANCH[k][0]; y += w * ANCH[k][1]; });
      x = x / s + (frac(Math.sin(i * 12.9898) * 43758.5453) - .5) * .16;
      y = y / s + (frac(Math.sin(i * 78.233) * 12543.123) - .5) * .16;
      return {name, v, x:Math.min(.97, Math.max(.03, x)) * W, y:Math.min(.96, Math.max(.04, y)) * H, j:i};
    });
  }
  new ResizeObserver(build).observe(hero);
  const move = e => { const r = hero.getBoundingClientRect(); ptr.x = e.clientX - r.left; ptr.y = e.clientY - r.top; ptr.on = true; ptr.last = Date.now(); };
  hero.addEventListener("pointermove", move, {passive:true});
  hero.addEventListener("pointerdown", move, {passive:true});
  hero.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") ptr.on = false; });
  let qx = 0, qy = 0;
  function frame(t){
    if (!$("v-home").hidden && W && H) {
      if (ptr.on && Date.now() - ptr.last > 4000) ptr.on = false;
      const auto = !ptr.on;
      const tx2 = auto ? W * (.64 + .28 * Math.sin(t * .00016)) : ptr.x;
      const ty2 = auto ? H * (.5 + .34 * Math.sin(t * .00023 + 1.3)) : ptr.y;
      if (!qx && !qy) { qx = tx2; qy = ty2; }
      qx += (tx2 - qx) * (auto ? .03 : .2); qy += (ty2 - qy) * (auto ? .03 : .2);
      g.clearRect(0, 0, W, H);
      const sigma = .32 * Math.max(W, H);
      const q = ANCH.map(([ax, ay]) => Math.exp(-((Math.hypot(qx - ax * W, qy - ay * H) / sigma) ** 2)));
      const top = nodes.map(n => ({n, c:cos(q, n.v)})).sort((a, b) => b.c - a.c).slice(0, 4);
      const small = W < 700, fade = small ? (ptr.on ? .85 : .5) : 1;
      g.fillStyle = C.ink;
      for (const n of nodes) {
        n.dx = n.x + (reduce ? 0 : Math.sin(t * .0004 + n.j) * 2); n.dy = n.y + (reduce ? 0 : Math.cos(t * .00035 + n.j) * 2);
        g.globalAlpha = .24; g.beginPath(); g.arc(n.dx, n.dy, 2, 0, Math.PI * 2); g.fill();
      }
      g.strokeStyle = C.accent; g.fillStyle = C.accent; g.lineWidth = 1;
      top.forEach(({n}, i) => {
        g.globalAlpha = (.55 - i * .1) * fade; g.beginPath(); g.moveTo(qx, qy); g.lineTo(n.dx, n.dy); g.stroke();
        g.globalAlpha = fade; g.beginPath(); g.arc(n.dx, n.dy, 3.2 - i * .4, 0, Math.PI * 2); g.fill();
      });
      g.globalAlpha = fade;
      g.beginPath(); g.arc(qx, qy, 8, 0, Math.PI * 2); g.stroke();
      g.beginPath(); g.moveTo(qx - 13, qy); g.lineTo(qx - 4, qy); g.moveTo(qx + 4, qy); g.lineTo(qx + 13, qy); g.moveTo(qx, qy - 13); g.lineTo(qx, qy - 4); g.moveTo(qx, qy + 4); g.lineTo(qx, qy + 13); g.stroke();
      const b = top[0];
      if (b && (!small || ptr.on)) {
        const label = L(b.n.name) + "  cos " + b.c.toFixed(3);
        g.font = "11px 'IBM Plex Mono', monospace"; const lw = g.measureText(label).width;
        const lx = Math.min(b.n.dx + 8, W - lw - 12), ly = b.n.dy - 10;
        g.globalAlpha = .9; g.fillStyle = C.paper; g.fillRect(lx - 4, ly - 12, lw + 8, 17);
        g.globalAlpha = 1; g.fillStyle = C.accent; g.fillText(label, lx, ly);
      }
      g.globalAlpha = 1;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

</script>
